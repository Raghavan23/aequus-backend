spring:
  application:
    name: aequus-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aequus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_db_password_here}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

aequus:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-32-bytes-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ai:
    openrouter:
      api-key: ${OPENROUTER_API_KEY:your_openrouter_api_key_here}
      model: ${OPENROUTER_VISION_MODEL:dots-studio/dots-3-note-preview:free}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

logging:
  level:
    com.aequus: INFO
